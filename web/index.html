<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pail</title>
    <meta name="color-scheme" content="light dark" />
    <!-- No external requests: the console must work on a private network with
         no internet access at all. -->

    <!-- The SVG is preferred by browsers that take one and stays sharp at any
         size. The PNGs are drawn separately at 16 and 32 rather than scaled
         down, because at those sizes the bars need to be thicker and further
         apart or they merge into a block. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#12211d" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
